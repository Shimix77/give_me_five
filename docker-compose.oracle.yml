services:
  editor:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    restart: unless-stopped
    environment:
      GMF_ACCESS_USER: ${GMF_ACCESS_USER:-give-me-five}
      GMF_ACCESS_KEY: ${GMF_ACCESS_KEY:?Nastavte GMF_ACCESS_KEY v subore .env.oracle}
    volumes:
      - gmf-data:/var/lib/give-me-five
    expose:
      - "4173"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      editor:
        condition: service_healthy
    environment:
      GMF_DOMAIN: ${GMF_DOMAIN:?Nastavte GMF_DOMAIN v subore .env.oracle}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  gmf-data:
  caddy-data:
  caddy-config:

