name: give-me-five-oracle

services:
  editor:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    restart: unless-stopped
    environment:
      GMF_ACCESS_USER: ${GMF_ACCESS_USER:-give-me-five}
      GMF_ACCESS_KEY: ${GMF_ACCESS_KEY:?Nastavte GMF_ACCESS_KEY v deploy/oracle/.env}
      GMF_MAX_UPLOAD_MB: ${GMF_MAX_UPLOAD_MB:-300}
      GMF_MIN_FREE_DISK_MB: ${GMF_MIN_FREE_DISK_MB:-512}
    volumes:
      - gmf-models:/var/lib/give-me-five/models
    tmpfs:
      - /var/lib/give-me-five/session:size=${GMF_SESSION_TMPFS_SIZE:-2g},mode=0700,uid=1000,gid=1000
      - /tmp:size=256m,mode=1777,nosuid,nodev
    expose:
      - "4173"
    read_only: true
    init: false
    pids_limit: 256
    mem_limit: 10g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      editor:
        condition: service_healthy
    environment:
      GMF_DOMAIN: ${GMF_DOMAIN:?Nastavte GMF_DOMAIN v deploy/oracle/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  gmf-models:
  caddy-data:
  caddy-config:
